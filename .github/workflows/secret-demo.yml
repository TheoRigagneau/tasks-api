name: Secret Demo

on:
  workflow_dispatch:

jobs:
  secret-demo:
    runs-on: ubuntu-latest

    env:
      DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}

    steps:
      - name: Vérifier le secret
        run: |
          if [ -z "$DEMO_TOKEN" ]; then
            echo "DEMO_TOKEN est vide"
            exit 1
          fi

          echo "Longueur du secret : ${#DEMO_TOKEN}"
          echo "Valeur du secret : $DEMO_TOKEN"

      - name: Afficher APP_ENV
        run: echo "APP_ENV = ${{ vars.APP_ENV }}"
