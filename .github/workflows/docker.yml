
name: Docker CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    name: Tests Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: |
          pip install -r requirements-dev.txt

      - name: Lancer les tests
        run: pytest

  build:
    name: Build et publication GHCR
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calculer le nom de l'image et la version
        id: vars
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "repository=${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "app_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "app_version=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Connexion à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Générer les tags Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner }}/${{ steps.vars.outputs.repository }}
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Construire et publier l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.app_version }}
            
  deploy-staging:
    name: Déploiement simulé - Staging
    runs-on: ubuntu-latest
    needs: build
    environment: staging

    permissions:
      packages: read

    steps:
      - name: Calculer le nom de l'image
        id: vars
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "repository=${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Connexion à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Télécharger l'image du commit
        run: |
          docker pull ghcr.io/${{ steps.vars.outputs.owner }}/${{ steps.vars.outputs.repository }}:sha-${{ steps.vars.outputs.short_sha }}

      - name: Lancer l'API en staging
        run: |
          docker run -d --name tasks-api-staging -p 8000:8000 \
            ghcr.io/${{ steps.vars.outputs.owner }}/${{ steps.vars.outputs.repository }}:sha-${{ steps.vars.outputs.short_sha }}

      - name: Test de fumée
        shell: bash
        run: |
          echo "Attente et vérification de /health..."

          if ! curl -fsS --retry 15 --retry-delay 3 --retry-all-errors --retry-max-time 60 http://127.0.0.1:8000/health; then
            echo "Échec du test /health"
            docker ps -a
            docker logs tasks-api-staging
            exit 1
          fi

          echo "Vérification de /version..."

          if ! curl -fsS --retry 15 --retry-delay 3 --retry-all-errors --retry-max-time 60 http://127.0.0.1:8000/version; then
            echo "Échec du test /version"
            docker logs tasks-api-staging
            exit 1
          fi

  deploy-production:
    name: Déploiement simulé - Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production

    permissions:
      packages: read

    steps:
      - name: Calculer le nom de l'image et la version
        id: vars
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "repository=${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Connexion à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Télécharger l'image de la release
        run: |
          docker pull ghcr.io/${{ steps.vars.outputs.owner }}/${{ steps.vars.outputs.repository }}:${{ steps.vars.outputs.version }}

      - name: Lancer l'API en production
        run: |
          docker run -d --name tasks-api-production -p 8000:8000 \
            ghcr.io/${{ steps.vars.outputs.owner }}/${{ steps.vars.outputs.repository }}:${{ steps.vars.outputs.version }}

      - name: Test de fumée
        shell: bash
        run: |
          echo "Attente et vérification de /health..."

          if ! curl -fsS --retry 15 --retry-delay 3 --retry-all-errors --retry-max-time 60 http://127.0.0.1:8000/health; then
            echo "Échec du test /health"
            docker ps -a
            docker logs tasks-api-production
            exit 1
          fi

          echo "Vérification de /version..."

          if ! curl -fsS --retry 15 --retry-delay 3 --retry-all-errors --retry-max-time 60 http://127.0.0.1:8000/version; then
            echo "Échec du test /version"
            docker logs tasks-api-production
            exit 1
          fi
  update-config:
    needs: deploy-production                          # TROU 1 : ce job démarre après quel job ?
    if: startsWith(github.ref, 'refs/tags/v')   # TROU 2 : uniquement sur un tag : regardez la ligne `if` de deploy-production ; si elle est écrite autrement, recopiez-la telle quelle à la place de cette ligne
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ github.ref_name }}   # le nom du tag, par exemple v0.2.0
    steps:
      - name: Récupérer le dépôt applicatif
        uses: actions/checkout@v6       # même version que vos autres jobs

      - name: Récupérer le dépôt de configuration
        uses: actions/checkout@v6
        with:
          repository: theorigagneau/tasks-config  # TROU 3 : votre compte GitHub (minuscules)
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config

      - name: Mettre à jour la version de l'image
        run: bash scripts/set-image-tag.sh config/k8s/deployment.yaml "${VERSION#v}"

      - name: Commiter et pousser dans tasks-config
        run: |
          cd config
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "Déploiement de tasks-api ${VERSION#v}"
          git push

